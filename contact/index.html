<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Holly Hill</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta property="og:type" content="website">
<meta property="og:title" content="Contact — Holly Hill">
<meta property="og:description" content="Get in touch with Holly Hill Farm — mushrooms, honey, eggs, and surplus finds near New Lexington, Ohio.">
<meta property="og:image" content="https://hollyhillohio.com/og-farm.png">
<meta property="og:url" content="https://hollyhillohio.com/contact/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Contact — Holly Hill">
<meta name="twitter:description" content="Get in touch with Holly Hill Farm — mushrooms, honey, eggs, and surplus finds near New Lexington, Ohio.">
<meta name="twitter:image" content="https://hollyhillohio.com/og-farm.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Work+Sans:wght@400;500;600;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F3ECDA;
    --paper-2:#EBE1C8;
    --paper-deep:#E3D6B6;
    --ink:#2B3A2A;
    --ink-soft:#4A5A46;
    --rust:#6B4226;
    --honey:#C98A2C;
    --mushroom:#8B4A3C;
    --egg:#6E8577;
    --display:'Fraunces', serif;
    --body:'Work Sans', -apple-system, sans-serif;
    --mono:'Courier Prime', 'Courier New', monospace;
  }
  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:var(--body); line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  a{ color:inherit; }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; scroll-behavior:auto !important; }
  }
  .wrap{ max-width:1120px; margin:0 auto; padding:0 28px; }
  a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible{ outline:3px solid var(--honey); outline-offset:3px; }

  .paper-texture{
    position:fixed; inset:0; z-index:0; pointer-events:none; opacity:0.5; mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.012' numOctaves='3' seed='4' stitchTiles='stitch'/><feColorMatrix type='matrix' values='0 0 0 0 0.85  0 0 0 0 0.80  0 0 0 0 0.65  0 0 0 0.5 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }
  .grain{
    position:fixed; inset:0; z-index:60; pointer-events:none; opacity:0.05; mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23g)'/></svg>");
  }

  .topbar{ position:relative; z-index:2; border-bottom:2px solid var(--ink); background:var(--paper); }
  .topbar-inner{ display:flex; align-items:center; justify-content:space-between; padding:18px 28px; }
  .wordmark{ font-family:var(--display); font-weight:600; font-size:22px; text-decoration:none; letter-spacing:0.01em; }
  .topnav{ display:none; gap:26px; font-family:var(--mono); font-size:12.5px; letter-spacing:0.04em; text-transform:uppercase; }
  .topnav a{ text-decoration:none; border-bottom:1px solid transparent; transition:border-color .2s ease; }
  .topnav a:hover{ border-color:var(--ink); }
  @media(min-width:720px){ .topnav{ display:flex; } }

  .hero{ position:relative; z-index:1; padding:64px 0 40px; text-align:center; }
  .eyebrow{
    font-family:var(--mono); font-size:12px; letter-spacing:0.12em; text-transform:uppercase;
    color:var(--ink-soft); margin-bottom:18px;
  }
  .eyebrow .sep{ margin:0 10px; color:var(--rust); }
  .hero h1{
    font-family:var(--display); font-weight:600; font-size:clamp(40px, 7vw, 72px);
    line-height:0.98; margin:0 0 14px; letter-spacing:-0.01em;
  }
  .hero p.lede{ max-width:52ch; margin:0 auto; font-size:16.5px; color:var(--ink-soft); }

  .torn{
    position:relative; z-index:1; height:34px; background:var(--paper-2);
    -webkit-mask-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 20' preserveAspectRatio='none'><path d='M0 20 L0 6 L10 9 L22 3 L35 10 L48 4 L61 11 L75 2 L90 9 L104 5 L118 12 L133 3 L148 8 L163 2 L178 10 L194 4 L210 11 L226 3 L242 9 L258 5 L274 12 L290 2 L306 9 L322 4 L338 11 L354 3 L370 8 L386 5 L400 9 L400 20 Z'/></svg>");
    mask-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 20' preserveAspectRatio='none'><path d='M0 20 L0 6 L10 9 L22 3 L35 10 L48 4 L61 11 L75 2 L90 9 L104 5 L118 12 L133 3 L148 8 L163 2 L178 10 L194 4 L210 11 L226 3 L242 9 L258 5 L274 12 L290 2 L306 9 L322 4 L338 11 L354 3 L370 8 L386 5 L400 9 L400 20 Z'/></svg>");
    -webkit-mask-size:100% 100%; mask-size:100% 100%;
  }

  .contact-section{ position:relative; z-index:1; background:var(--paper-2); padding:56px 0 70px; }

  .contact-card{
    max-width:560px; margin:0 auto; background:var(--paper); border:2px solid var(--ink);
    border-radius:2px; padding:36px 32px; box-shadow:6px 6px 0 rgba(43,58,42,0.12);
  }
  .field{ margin-bottom:20px; display:flex; flex-direction:column; gap:6px; }
  .field label{
    font-family:var(--mono); font-size:11px; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--ink-soft);
  }
  .field input, .field textarea{
    font-family:var(--body); font-size:15px; padding:11px 12px; border:2px solid var(--ink);
    border-radius:2px; background:var(--paper); color:var(--ink); resize:vertical;
  }
  .field textarea{ min-height:140px; }
  .field-error{
    font-family:var(--mono); font-size:12px; color:#8C2E2E; min-height:14px;
  }
  .hp-field{ position:absolute; left:-9999px; top:-9999px; }

  .turnstile-wrap{ margin:6px 0 22px; }

  .submit-btn{
    font-family:var(--mono); font-size:13px; letter-spacing:0.05em; text-transform:uppercase;
    background:var(--ink); color:var(--paper); border:none; padding:13px 24px; border-radius:2px;
    cursor:pointer; width:100%; transition:background .15s ease;
  }
  .submit-btn:hover{ background:var(--rust); }
  .submit-btn:disabled{ opacity:0.6; cursor:not-allowed; }

  .form-status{
    font-family:var(--mono); font-size:13px; margin-top:14px; padding:12px 14px;
    border-radius:2px; display:none;
  }
  .form-status.show{
    display:block; background:rgba(140,46,46,0.1); border:1px solid rgba(140,46,46,0.3); color:#8C2E2E;
  }

  .success-message{ text-align:center; padding:14px 0; }
  .success-message h3{ font-family:var(--display); font-weight:600; font-size:26px; margin:0 0 10px; }
  .success-message p{ color:var(--ink-soft); margin:0; }

  footer{ position:relative; z-index:1; padding:44px 0; text-align:center; }
  .footer-word{ font-family:var(--display); font-weight:600; font-size:22px; margin-bottom:8px; }
  .footer-tag{ font-family:var(--mono); font-size:12px; color:var(--ink-soft); letter-spacing:0.04em; margin-bottom:18px; }
  .footer-links{ display:flex; justify-content:center; gap:22px; flex-wrap:wrap; font-family:var(--mono); font-size:12px; letter-spacing:0.03em; margin-bottom:14px; }
  .footer-links a{ text-decoration:none; border-bottom:1px solid transparent; }
  .footer-links a:hover{ border-color:var(--ink); }
  .footer-est{ font-family:var(--mono); font-size:11px; color:var(--ink-soft); opacity:0.8; }
</style>
</head>
<body>

  <div class="paper-texture"></div>
  <div class="grain"></div>

  <div class="topbar">
    <div class="topbar-inner">
      <a href="/" class="wordmark">Holly Hill</a>
      <nav class="topnav">
        <a href="/#mushrooms">Mushrooms</a>
        <a href="/apiary/">Apiary</a>
        <a href="/eggs/">Eggs</a>
        <a href="/surplus/">Surplus</a>
        <a href="/contact/">Contact</a>
      </nav>
    </div>
  </div>

  <header class="hero">
    <div class="wrap">
      <div class="eyebrow">New Lexington, Ohio <span class="sep">&#10072;</span> Get In Touch</div>
      <h1>Contact</h1>
      <p class="lede">Questions about mushrooms, honey, eggs, or a surplus find? Send us a note and we'll get back to you.</p>
    </div>
  </header>

  <div class="torn"></div>

  <section class="contact-section">
    <div class="wrap">
      <div class="contact-card" id="contactCard">
        <form id="contactForm" novalidate>
          <div class="field">
            <label for="f-name">Name</label>
            <input type="text" id="f-name" name="name" autocomplete="name" required>
            <div class="field-error" id="err-name"></div>
          </div>
          <div class="field">
            <label for="f-email">Email</label>
            <input type="email" id="f-email" name="email" autocomplete="email" required>
            <div class="field-error" id="err-email"></div>
          </div>
          <div class="field">
            <label for="f-message">Message</label>
            <textarea id="f-message" name="message" required></textarea>
            <div class="field-error" id="err-message"></div>
          </div>

          <div class="field hp-field" aria-hidden="true">
            <label for="f-website">Website</label>
            <input type="text" id="f-website" name="website" tabindex="-1" autocomplete="off">
          </div>

          <div class="turnstile-wrap">
            <div class="cf-turnstile" data-sitekey="0x4AAAAAAEF9DP-ykg_Z_-3m"></div>
          </div>

          <button type="submit" class="submit-btn" id="submitBtn">Send Message</button>
          <div class="form-status" id="formStatus"></div>
        </form>
      </div>
    </div>
  </section>

  <footer>
    <div class="wrap">
      <div class="footer-word">Holly Hill</div>
      <div class="footer-tag">New Lexington, Ohio</div>
      <div class="footer-links">
        <a href="/contact/">Contact Us</a>
        <a href="/surplus/">Surplus Site</a>
      </div>
      <div class="footer-est">Holly Hill &middot; a family farm &middot; est. 2026</div>
    </div>
  </footer>

  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <script>
    var form = document.getElementById('contactForm');
    var statusEl = document.getElementById('formStatus');
    var submitBtn = document.getElementById('submitBtn');
    var cardEl = document.getElementById('contactCard');

    var EMAIL_REGEX = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    function showStatus(text) {
      statusEl.textContent = text;
      statusEl.className = 'form-status show';
    }
    function hideStatus() {
      statusEl.className = 'form-status';
    }
    function clearFieldErrors() {
      document.querySelectorAll('.field-error').forEach(function (el) { el.textContent = ''; });
    }
    function resetTurnstile() {
      if (window.turnstile) {
        try { window.turnstile.reset(); } catch (err) { /* not rendered yet */ }
      }
    }

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      hideStatus();
      clearFieldErrors();

      var name = document.getElementById('f-name').value.trim();
      var email = document.getElementById('f-email').value.trim();
      var message = document.getElementById('f-message').value.trim();
      var honeypot = document.getElementById('f-website').value;

      var turnstileInput = form.querySelector('[name="cf-turnstile-response"]');
      var turnstileToken = turnstileInput ? turnstileInput.value : '';

      var hasError = false;
      if (!name) {
        document.getElementById('err-name').textContent = 'Name is required.';
        hasError = true;
      }
      if (!EMAIL_REGEX.test(email)) {
        document.getElementById('err-email').textContent = 'Please enter a valid email address.';
        hasError = true;
      }
      if (!message) {
        document.getElementById('err-message').textContent = 'Message is required.';
        hasError = true;
      } else if (message.length > 3000) {
        document.getElementById('err-message').textContent = 'Message must be under 3000 characters.';
        hasError = true;
      }
      if (!turnstileToken) {
        showStatus('Please complete the verification check above.');
        hasError = true;
      }
      if (hasError) return;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending...';

      try {
        var res = await fetch('/api/contact', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: name,
            email: email,
            message: message,
            turnstileToken: turnstileToken,
            honeypot: honeypot,
          }),
        });
        var data = await res.json();

        if (!res.ok) {
          if (data.fields) {
            if (data.fields.name) document.getElementById('err-name').textContent = data.fields.name;
            if (data.fields.email) document.getElementById('err-email').textContent = data.fields.email;
            if (data.fields.message) document.getElementById('err-message').textContent = data.fields.message;
          }
          showStatus(data.error || 'Something went wrong. Please try again.');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Send Message';
          resetTurnstile();
          return;
        }

        cardEl.innerHTML =
          '<div class="success-message">' +
          '<h3>Thanks — we&rsquo;ll get back to you</h3>' +
          '<p>Your message has been sent. We usually reply within a day or two.</p>' +
          '</div>';
      } catch (err) {
        showStatus('Something went wrong. Please try again.');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send Message';
        resetTurnstile();
      }
    });
  </script>

</body>
</html>
