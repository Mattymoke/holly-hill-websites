<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop — Holly Hill Surplus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0A0912; --void-2:#141126; --void-3:#1D1830; --line:rgba(245,243,250,0.1);
    --pink:#FF2E9A; --violet:#8A4FFF; --cyan:#2BE8DC; --paper:#F5F3FA; --muted:#9A93B5;
    --grad: linear-gradient(90deg, var(--pink), var(--violet) 52%, var(--cyan));
    --display:'Rajdhani', sans-serif; --body:'Work Sans', -apple-system, sans-serif; --mono:'IBM Plex Mono', monospace;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; background:var(--void); color:var(--paper); font-family:var(--body); }
  a{ color:inherit; } button{ font:inherit; cursor:pointer; }
  .wrap{ max-width:1080px; margin:0 auto; padding:0 24px; }
  a:focus-visible, button:focus-visible{ outline:3px solid var(--cyan); outline-offset:3px; }

  .topbar{ border-bottom:1px solid var(--line); background:rgba(10,9,18,0.9); position:sticky; top:0; z-index:10; }
  .topbar-inner{ display:flex; align-items:center; justify-content:space-between; padding:16px 24px; }
  .wordmark{ font-family:var(--display); font-weight:700; font-size:20px; text-decoration:none; }
  .wordmark span{ color:var(--pink); }
  .backlink{ font-family:var(--mono); font-size:12px; color:var(--muted); text-decoration:none; margin-right:20px; }
  #auth-area{ display:flex; align-items:center; gap:12px; }

  .btn{ font-family:var(--mono); font-size:12.5px; letter-spacing:0.04em; text-transform:uppercase; padding:10px 18px; border-radius:6px; border:none; text-decoration:none; display:inline-flex; align-items:center; gap:8px; }
  .btn-primary{ background:var(--grad); color:var(--void); font-weight:700; }
  .btn-ghost{ background:transparent; border:1px solid rgba(245,243,250,0.3); color:var(--paper); }

  header.hero{ padding:50px 0 30px; }
  header.hero h1{ font-family:var(--display); font-weight:700; font-size:clamp(32px,6vw,52px); margin:0 0 10px; }
  header.hero p{ color:var(--muted); max-width:56ch; }

  #status-msg{ font-family:var(--mono); font-size:13px; padding:12px 16px; border-radius:8px; margin-bottom:20px; display:none; }
  #status-msg.show{ display:block; }
  #status-msg.error{ background:rgba(226,74,74,0.15); color:#F5A9A9; border:1px solid rgba(226,74,74,0.3); }
  #status-msg.info{ background:rgba(43,232,220,0.1); color:var(--cyan); border:1px solid rgba(43,232,220,0.25); }

  .grid{ display:grid; gap:22px; grid-template-columns:1fr; padding-bottom:80px; }
  @media(min-width:640px){ .grid{ grid-template-columns:repeat(2,1fr); } }
  @media(min-width:980px){ .grid{ grid-template-columns:repeat(3,1fr); } }

  .card{
    background:linear-gradient(160deg, rgba(29,24,48,0.62), rgba(20,17,38,0.62));
    backdrop-filter:blur(16px); border:1px solid var(--line); border-radius:14px; padding:22px;
    display:flex; flex-direction:column; transition:border-color .2s ease, transform .2s ease;
  }
  .card:hover{ border-color:rgba(255,46,154,0.4); transform:translateY(-4px); }
  .card .cat{ font-family:var(--mono); font-size:10.5px; letter-spacing:0.08em; text-transform:uppercase; color:var(--muted); margin-bottom:8px; }
  .card h3{ font-family:var(--display); font-weight:700; font-size:20px; margin:0 0 8px; }
  .card p.desc{ font-size:13.5px; color:var(--muted); margin:0 0 16px; flex:1; }
  .card .price{ font-family:var(--display); font-weight:700; font-size:26px; background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; margin-bottom:14px; }
  .card .buy-btn{ width:100%; justify-content:center; }
  .card .buy-btn:disabled{ opacity:0.5; cursor:not-allowed; }

  .empty{ text-align:center; color:var(--muted); font-family:var(--mono); font-size:13px; padding:60px 20px; border:1px dashed var(--line); border-radius:14px; }
</style>
</head>
<body>

  <div class="topbar">
    <div class="wrap topbar-inner">
      <div style="display:flex; align-items:center;">
        <a href="/surplus/" class="backlink">&larr; Surplus</a>
        <a href="/surplus/shop/" class="wordmark">HOLLY HILL <span>Shop</span></a>
      </div>
      <div id="auth-area">
        <!-- Clerk fills this in once loaded -->
      </div>
    </div>
  </div>

  <div class="wrap">
    <header class="hero">
      <h1>The Shop</h1>
      <p>Every lot here is real, currently available, and priced cheaper than the same item on eBay — since there's no marketplace fee to cover.</p>
    </header>

    <div id="status-msg"></div>

    <div class="grid" id="lots-grid">
      <div class="empty">Loading current lots&hellip;</div>
    </div>
  </div>

  <script src="/surplus/shop/clerk-loader.js"></script>
  <script>
    var authArea = document.getElementById('auth-area');
    var lotsGrid = document.getElementById('lots-grid');
    var statusMsg = document.getElementById('status-msg');
    var clerkInstance = null;

    function showStatus(text, kind) {
      statusMsg.textContent = text;
      statusMsg.className = 'show ' + (kind || 'info');
    }
    function hideStatus() {
      statusMsg.className = '';
    }

    function money(cents) {
      return '$' + (cents / 100).toFixed(2);
    }

    function renderAuthArea() {
      authArea.innerHTML = '';
      if (clerkInstance.user) {
        var acctLink = document.createElement('a');
        acctLink.href = '/surplus/shop/account/';
        acctLink.className = 'btn btn-ghost';
        acctLink.textContent = 'My Orders';
        authArea.appendChild(acctLink);

        var userDiv = document.createElement('div');
        authArea.appendChild(userDiv);
        clerkInstance.mountUserButton(userDiv);
      } else {
        var signInBtn = document.createElement('button');
        signInBtn.className = 'btn btn-primary';
        signInBtn.textContent = 'Sign In';
        signInBtn.onclick = function () { clerkInstance.openSignIn({}); };
        authArea.appendChild(signInBtn);
      }
    }

    function renderLots(lots) {
      if (!lots.length) {
        lotsGrid.innerHTML = '<div class="empty">No lots available right now — check back soon.</div>';
        return;
      }
      lotsGrid.innerHTML = '';
      lots.forEach(function (lot) {
        var card = document.createElement('div');
        card.className = 'card';
        card.innerHTML =
          '<div class="cat">' + (lot.category || 'Surplus') + '</div>' +
          '<h3></h3>' +
          '<p class="desc"></p>' +
          '<div class="price">' + money(lot.website_price_cents) + '</div>' +
          '<button class="btn btn-primary buy-btn">Buy Now</button>';
        card.querySelector('h3').textContent = lot.name;
        card.querySelector('.desc').textContent = lot.description || '';
        var buyBtn = card.querySelector('.buy-btn');
        buyBtn.addEventListener('click', function () { handleBuy(lot.id, buyBtn); });
        lotsGrid.appendChild(card);
      });
    }

    async function loadLots() {
      try {
        var res = await fetch('/api/lots');
        var data = await res.json();
        renderLots(data.lots || []);
      } catch (err) {
        lotsGrid.innerHTML = '<div class="empty">Couldn\'t load lots right now. Try refreshing.</div>';
      }
    }

    async function handleBuy(lotId, buttonEl) {
      hideStatus();
      if (!clerkInstance.user) {
        clerkInstance.openSignIn({});
        return;
      }
      buttonEl.disabled = true;
      buttonEl.textContent = 'Starting checkout...';
      try {
        var token = await clerkInstance.session.getToken();
        var res = await fetch('/api/checkout', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token,
          },
          body: JSON.stringify({ lotId: lotId }),
        });
        var data = await res.json();
        if (!res.ok) {
          showStatus(data.error || 'Something went wrong starting checkout.', 'error');
          buttonEl.disabled = false;
          buttonEl.textContent = 'Buy Now';
          if (res.status === 409) loadLots(); // lot no longer available, refresh the list
          return;
        }
        window.location.href = data.checkoutUrl;
      } catch (err) {
        showStatus('Something went wrong. Please try again.', 'error');
        buttonEl.disabled = false;
        buttonEl.textContent = 'Buy Now';
      }
    }

    window.clerkReady.then(function (clerk) {
      clerkInstance = clerk;
      renderAuthArea();
      clerk.addListener(function () { renderAuthArea(); });
    }).catch(function (err) {
      showStatus('Sign-in is temporarily unavailable: ' + err.message, 'error');
    });

    loadLots();
  </script>

</body>
</html>
