<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Holly Hill Surplus</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0A0912; --void-2:#141126; --void-3:#1D1830; --line:rgba(245,243,250,0.12);
    --pink:#FF2E9A; --violet:#8A4FFF; --cyan:#2BE8DC; --paper:#F5F3FA; --muted:#9A93B5;
    --grad: linear-gradient(90deg, var(--pink), var(--violet) 52%, var(--cyan));
    --display:'Rajdhani', sans-serif; --body:'Work Sans', -apple-system, sans-serif; --mono:'IBM Plex Mono', monospace;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; background:var(--void); color:var(--paper); font-family:var(--body); }
  a{ color:inherit; } button,select,input,textarea{ font:inherit; }
  .wrap{ max-width:1000px; margin:0 auto; padding:0 24px 80px; }
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible{ outline:3px solid var(--cyan); outline-offset:2px; }

  .topbar{ border-bottom:1px solid var(--line); background:rgba(10,9,18,0.92); position:sticky; top:0; z-index:20; }
  .topbar-inner{ display:flex; align-items:center; justify-content:space-between; padding:16px 24px; }
  .wordmark{ font-family:var(--display); font-weight:700; font-size:20px; text-decoration:none; }
  .wordmark span{ color:var(--pink); }
  .backlink{ font-family:var(--mono); font-size:12px; color:var(--muted); text-decoration:none; margin-right:20px; }
  #auth-area{ display:flex; align-items:center; gap:12px; }

  .btn{ font-family:var(--mono); font-size:12px; letter-spacing:0.04em; text-transform:uppercase; padding:9px 16px; border-radius:6px; border:none; text-decoration:none; display:inline-flex; align-items:center; gap:6px; cursor:pointer; }
  .btn-primary{ background:var(--grad); color:var(--void); font-weight:700; }
  .btn-ghost{ background:transparent; border:1px solid rgba(245,243,250,0.3); color:var(--paper); }
  .btn-danger{ background:rgba(226,74,74,0.15); border:1px solid rgba(226,74,74,0.4); color:#F5A9A9; }
  .btn:disabled{ opacity:0.5; cursor:not-allowed; }

  header.hero{ padding:32px 0 20px; }
  header.hero h1{ font-family:var(--display); font-weight:700; font-size:clamp(28px,5vw,38px); margin:0 0 6px; }
  header.hero p{ color:var(--muted); font-size:13.5px; }

  #gate{ text-align:center; padding:80px 20px; }
  #gate p{ color:var(--muted); margin-bottom:20px; }

  #status-msg{ font-family:var(--mono); font-size:12.5px; padding:10px 14px; border-radius:8px; margin-bottom:16px; display:none; }
  #status-msg.show{ display:block; }
  #status-msg.error{ background:rgba(226,74,74,0.15); color:#F5A9A9; border:1px solid rgba(226,74,74,0.3); }
  #status-msg.success{ background:rgba(43,232,220,0.1); color:var(--cyan); border:1px solid rgba(43,232,220,0.25); }

  .panel{ background:var(--void-2); border:1px solid var(--line); border-radius:12px; padding:22px; margin-bottom:26px; }
  .panel h2{ font-family:var(--display); font-weight:700; font-size:18px; margin:0 0 16px; }

  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px; }
  @media(max-width:600px){ .form-grid{ grid-template-columns:1fr; } }
  .field{ display:flex; flex-direction:column; gap:5px; }
  .field.full{ grid-column:1 / -1; }
  .field label{ font-family:var(--mono); font-size:10.5px; letter-spacing:0.05em; text-transform:uppercase; color:var(--muted); }
  .field input, .field select, .field textarea{
    background:var(--void); border:1px solid var(--line); border-radius:6px; color:var(--paper);
    padding:9px 10px; font-size:13.5px;
  }
  .field textarea{ resize:vertical; min-height:60px; }

  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th{ text-align:left; font-family:var(--mono); font-size:10.5px; letter-spacing:0.05em; text-transform:uppercase; color:var(--muted); padding:8px 10px; border-bottom:1px solid var(--line); }
  td{ padding:10px; border-bottom:1px solid var(--line); vertical-align:middle; }
  td.name{ font-weight:600; }
  .thumb{ width:48px; height:48px; border-radius:8px; object-fit:cover; display:block; border:1px solid var(--line); background:var(--void); }
  .thumb-placeholder{ border:1px dashed var(--line); }
  .status-pill{ font-family:var(--mono); font-size:10px; letter-spacing:0.04em; text-transform:uppercase; padding:4px 10px; border-radius:20px; }
  .status-available{ background:rgba(43,232,220,0.12); color:var(--cyan); }
  .status-reserved{ background:rgba(201,138,44,0.15); color:#E0B86B; }
  .status-sold{ background:rgba(255,255,255,0.08); color:var(--muted); }
  .status-paid{ background:rgba(43,232,220,0.12); color:var(--cyan); }
  .status-pending{ background:rgba(255,255,255,0.08); color:var(--muted); }
  .status-failed, .status-refunded{ background:rgba(226,74,74,0.12); color:#F5A9A9; }
  .row-actions{ display:flex; gap:6px; }
  .price-edit{ width:80px; }
  .empty-row td{ color:var(--muted); font-family:var(--mono); font-size:12px; text-align:center; padding:24px; }
  .table-scroll{ overflow-x:auto; }
</style>
</head>
<body>

  <div class="topbar">
    <div class="wrap topbar-inner" style="padding-left:0; padding-right:0;">
      <div style="display:flex; align-items:center;">
        <a href="/surplus/shop/" class="backlink">&larr; Shop</a>
        <a href="/surplus/shop/admin/" class="wordmark">HOLLY HILL <span>Admin</span></a>
      </div>
      <div id="auth-area"></div>
    </div>
  </div>

  <div class="wrap">
    <header class="hero">
      <h1>Admin</h1>
      <p>Add lots, update prices and status, review orders — everything the spreadsheet used to do by hand.</p>
    </header>

    <div id="status-msg"></div>
    <div id="gate">
      <p>Checking access&hellip;</p>
    </div>

    <div id="adminContent" style="display:none;">

      <div class="panel">
        <h2>Add a new lot</h2>
        <form id="addLotForm">
          <div class="form-grid">
            <div class="field">
              <label for="f-id">Lot # / SKU</label>
              <input type="text" id="f-id" required placeholder="A1235">
            </div>
            <div class="field">
              <label for="f-category">Category</label>
              <select id="f-category">
                <option>Coins & Currency</option>
                <option>Electronics</option>
                <option>Networking</option>
                <option>Computer Parts</option>
                <option>Industrial Equipment</option>
                <option>Furniture</option>
                <option>Tools</option>
                <option>Vehicles</option>
                <option>Other</option>
              </select>
            </div>
            <div class="field full">
              <label for="f-name">Item name</label>
              <input type="text" id="f-name" required placeholder="Peace Dollar Lot (20 coins)">
            </div>
            <div class="field full">
              <label for="f-desc">Description</label>
              <textarea id="f-desc" placeholder="Condition notes, what's included, anything a buyer should know."></textarea>
            </div>
            <div class="field">
              <label for="f-price">Website price ($)</label>
              <input type="number" id="f-price" min="0" step="0.01" required placeholder="70.00">
            </div>
          </div>
          <button type="submit" class="btn btn-primary" id="addLotBtn">Add Lot</button>
        </form>
      </div>

      <div class="panel">
        <h2>All lots</h2>
        <div class="table-scroll">
          <table>
            <thead>
              <tr><th></th><th>Lot</th><th>Name</th><th>Category</th><th>Price</th><th>Status</th><th></th></tr>
            </thead>
            <tbody id="lotsTableBody">
              <tr class="empty-row"><td colspan="7">Loading&hellip;</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="panel">
        <h2>Recent orders (all buyers)</h2>
        <div class="table-scroll">
          <table>
            <thead>
              <tr><th>Lot</th><th>Amount</th><th>Status</th><th>Date</th></tr>
            </thead>
            <tbody id="ordersTableBody">
              <tr class="empty-row"><td colspan="4">Loading&hellip;</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

  <script src="/surplus/shop/clerk-loader.js"></script>
  <script>
    var authArea = document.getElementById('auth-area');
    var gate = document.getElementById('gate');
    var adminContent = document.getElementById('adminContent');
    var statusMsg = document.getElementById('status-msg');
    var lotsTableBody = document.getElementById('lotsTableBody');
    var ordersTableBody = document.getElementById('ordersTableBody');
    var addLotForm = document.getElementById('addLotForm');
    var addLotBtn = document.getElementById('addLotBtn');

    var clerkInstance = null;

    function showStatus(text, kind) {
      statusMsg.textContent = text;
      statusMsg.className = 'show ' + (kind || 'success');
    }
    function hideStatus() { statusMsg.className = ''; }
    function money(cents) { return '$' + (cents / 100).toFixed(2); }
    function formatDate(iso) {
      if (!iso) return '';
      return new Date(iso + 'Z').toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
    }
    async function authHeader() {
      var token = await clerkInstance.session.getToken();
      return { 'Authorization': 'Bearer ' + token };
    }

    function renderAuthArea() {
      authArea.innerHTML = '';
      if (clerkInstance.user) {
        var userDiv = document.createElement('div');
        authArea.appendChild(userDiv);
        clerkInstance.mountUserButton(userDiv);
      } else {
        var signInBtn = document.createElement('button');
        signInBtn.className = 'btn btn-primary';
        signInBtn.textContent = 'Sign In';
        signInBtn.onclick = function () { clerkInstance.openSignIn({}); };
        authArea.appendChild(signInBtn);
      }
    }

    function parseImageUrls(lot) {
      if (!lot.image_urls) return [];
      try {
        var parsed = JSON.parse(lot.image_urls);
        return Array.isArray(parsed) ? parsed : [];
      } catch (err) {
        return [];
      }
    }

    function renderLots(lots) {
      if (!lots.length) {
        lotsTableBody.innerHTML = '<tr class="empty-row"><td colspan="7">No lots yet — add one above.</td></tr>';
        return;
      }
      lotsTableBody.innerHTML = '';
      lots.forEach(function (lot) {
        var tr = document.createElement('tr');
        tr.innerHTML =
          '<td class="thumb-cell"></td>' +
          '<td class="mono"></td>' +
          '<td class="name"></td>' +
          '<td class="cat"></td>' +
          '<td><input type="number" class="price-edit" min="0" step="0.01" value="' + (lot.website_price_cents / 100).toFixed(2) + '"></td>' +
          '<td>' +
            '<select class="status-select">' +
              '<option value="available"' + (lot.status === 'available' ? ' selected' : '') + '>available</option>' +
              '<option value="reserved"' + (lot.status === 'reserved' ? ' selected' : '') + '>reserved</option>' +
              '<option value="sold"' + (lot.status === 'sold' ? ' selected' : '') + '>sold</option>' +
            '</select>' +
          '</td>' +
          '<td class="row-actions">' +
            '<button class="btn btn-ghost save-btn">Save</button>' +
            '<button class="btn btn-danger delete-btn">Delete</button>' +
          '</td>';
        var imageUrls = parseImageUrls(lot);
        var thumbCell = tr.querySelector('.thumb-cell');
        if (imageUrls.length) {
          var thumbImg = document.createElement('img');
          thumbImg.className = 'thumb';
          thumbImg.src = imageUrls[0];
          thumbImg.alt = '';
          thumbCell.appendChild(thumbImg);
        } else {
          var thumbPlaceholder = document.createElement('div');
          thumbPlaceholder.className = 'thumb thumb-placeholder';
          thumbCell.appendChild(thumbPlaceholder);
        }
        tr.querySelector('.mono').textContent = lot.id;
        tr.querySelector('.name').textContent = lot.name;
        tr.querySelector('.cat').textContent = lot.category || '—';

        tr.querySelector('.save-btn').addEventListener('click', function () {
          var newPrice = Math.round(parseFloat(tr.querySelector('.price-edit').value) * 100);
          var newStatus = tr.querySelector('.status-select').value;
          updateLot(lot.id, { website_price_cents: newPrice, status: newStatus });
        });
        tr.querySelector('.delete-btn').addEventListener('click', function () {
          if (confirm('Delete lot ' + lot.id + '? This cannot be undone.')) {
            deleteLot(lot.id);
          }
        });
        lotsTableBody.appendChild(tr);
      });
    }

    function renderOrders(orders) {
      if (!orders.length) {
        ordersTableBody.innerHTML = '<tr class="empty-row"><td colspan="4">No orders yet.</td></tr>';
        return;
      }
      ordersTableBody.innerHTML = '';
      orders.forEach(function (o) {
        var tr = document.createElement('tr');
        tr.innerHTML =
          '<td class="name"></td>' +
          '<td>' + money(o.amount_cents) + '</td>' +
          '<td><span class="status-pill status-' + o.status + '"></span></td>' +
          '<td>' + formatDate(o.created_at) + '</td>';
        tr.querySelector('.name').textContent = o.lot_name;
        tr.querySelector('.status-pill').textContent = o.status;
        ordersTableBody.appendChild(tr);
      });
    }

    async function loadLots() {
      var res = await fetch('/api/admin/lots', { headers: await authHeader() });
      if (!res.ok) throw new Error('lots');
      var data = await res.json();
      renderLots(data.lots || []);
    }

    async function loadOrders() {
      var res = await fetch('/api/admin/orders', { headers: await authHeader() });
      if (!res.ok) throw new Error('orders');
      var data = await res.json();
      renderOrders(data.orders || []);
    }

    async function updateLot(id, fields) {
      hideStatus();
      try {
        var res = await fetch('/api/admin/lots/update', {
          method: 'POST',
          headers: Object.assign({ 'Content-Type': 'application/json' }, await authHeader()),
          body: JSON.stringify(Object.assign({ id: id }, fields)),
        });
        if (!res.ok) throw new Error();
        showStatus('Saved.', 'success');
        loadLots();
      } catch (err) {
        showStatus('Could not save that change.', 'error');
      }
    }

    async function deleteLot(id) {
      hideStatus();
      try {
        var res = await fetch('/api/admin/lots/delete', {
          method: 'POST',
          headers: Object.assign({ 'Content-Type': 'application/json' }, await authHeader()),
          body: JSON.stringify({ id: id }),
        });
        if (!res.ok) throw new Error();
        showStatus('Deleted.', 'success');
        loadLots();
      } catch (err) {
        showStatus('Could not delete that lot.', 'error');
      }
    }

    addLotForm.addEventListener('submit', async function (e) {
      e.preventDefault();
      hideStatus();
      addLotBtn.disabled = true;
      addLotBtn.textContent = 'Adding...';
      try {
        var res = await fetch('/api/admin/lots/create', {
          method: 'POST',
          headers: Object.assign({ 'Content-Type': 'application/json' }, await authHeader()),
          body: JSON.stringify({
            id: document.getElementById('f-id').value.trim(),
            name: document.getElementById('f-name').value.trim(),
            category: document.getElementById('f-category').value,
            description: document.getElementById('f-desc').value.trim(),
            website_price_cents: Math.round(parseFloat(document.getElementById('f-price').value) * 100),
          }),
        });
        var data = await res.json();
        if (!res.ok) {
          showStatus(data.error || 'Could not add that lot.', 'error');
          return;
        }
        showStatus('Lot added.', 'success');
        addLotForm.reset();
        loadLots();
      } catch (err) {
        showStatus('Something went wrong adding that lot.', 'error');
      } finally {
        addLotBtn.disabled = false;
        addLotBtn.textContent = 'Add Lot';
      }
    });

    async function checkAdminAndLoad() {
      try {
        var res = await fetch('/api/admin/lots', { headers: await authHeader() });
        if (res.status === 403) {
          gate.innerHTML = '<p>You\'re signed in, but this account doesn\'t have admin access.</p>';
          return;
        }
        if (!res.ok) throw new Error();
        gate.style.display = 'none';
        adminContent.style.display = 'block';
        var data = await res.json();
        renderLots(data.lots || []);
        loadOrders();
      } catch (err) {
        gate.innerHTML = '<p>Couldn\'t verify admin access. Try refreshing.</p>';
      }
    }

    window.clerkReady.then(function (clerk) {
      clerkInstance = clerk;
      renderAuthArea();
      clerk.addListener(function () { renderAuthArea(); });

      if (clerk.user) {
        checkAdminAndLoad();
      } else {
        gate.innerHTML = '<p>Sign in with your admin account to continue.</p>';
        var btn = document.createElement('button');
        btn.className = 'btn btn-primary';
        btn.textContent = 'Sign In';
        btn.onclick = function () { clerk.openSignIn({}); };
        gate.appendChild(btn);
        clerk.addListener(function () {
          if (clerk.user) checkAdminAndLoad();
        });
      }
    }).catch(function (err) {
      gate.innerHTML = '<p>Sign-in is temporarily unavailable.</p>';
    });
  </script>

</body>
</html>
