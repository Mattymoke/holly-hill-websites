<style>
  :root{
    --void:#0A0D0A; --void-2:#12160F; --mist:rgba(230,235,220,0.06);
    --ink:#0A0D0A; --white:#F4F1E6;
    --display:'Anton', sans-serif;
    --body:'Poppins', -apple-system, sans-serif;
    --mono:'JetBrains Mono', monospace;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; background:var(--void); color:var(--white); font-family:var(--body); }
  a{ color:inherit; } img,svg{ display:block; max-width:100%; }
  button{ font:inherit; }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; }
  }
  a:focus-visible, button:focus-visible{ outline:3px solid #E8B84B; outline-offset:3px; }
  .wrap{ max-width:1180px; margin:0 auto; padding:0 24px; }

  .grain{
    position:fixed; inset:0; z-index:80; pointer-events:none; opacity:0.05; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23g)'/></svg>");
  }
  .mist-scene{ position:fixed; inset:0; z-index:1; pointer-events:none; overflow:hidden; }
  .mote{ position:absolute; bottom:-10px; width:3px; height:3px; border-radius:50%; background:radial-gradient(circle,#E8DCC2,rgba(232,220,194,0)); opacity:0; animation:moteRise linear infinite; }
  @keyframes moteRise{ 0%{ transform:translate(0,0); opacity:0; } 15%{ opacity:0.5; } 85%{ opacity:0.2; } 100%{ transform:translate(16px,-100vh); opacity:0; } }

  .stroke{ color:var(--white); text-shadow:0 0 30px currentColor, 0 0 60px rgba(232,184,75,0.35); }
  .stroke-white{ color:var(--white); text-shadow:0 2px 24px rgba(0,0,0,0.6); }

  /* ---------- header ---------- */
  header{ position:relative; z-index:2; padding:44px 0 34px; text-align:center; background:radial-gradient(ellipse at 50% -20%, rgba(201,138,44,0.18), transparent 60%), var(--void); color:#fff; border-bottom:1px solid rgba(232,220,194,0.08); }
  .backlink{ display:inline-block; font-family:var(--body); font-weight:700; font-size:13px; text-decoration:none; color:#fff; opacity:0.75; margin-bottom:18px; }
  .backlink:hover{ opacity:1; }
  header h1{ font-family:var(--display); font-size:clamp(38px,7vw,64px); margin:0 0 10px; letter-spacing:0.01em; }
  header p{ font-family:var(--body); font-weight:600; color:#cfcfd6; max-width:46ch; margin:0 auto; font-size:15px; }

  /* ---------- grid ---------- */
  .catalog{ position:relative; z-index:2; padding:50px 0 70px; }
  .grid{ display:grid; gap:24px; grid-template-columns:1fr; }
  @media(min-width:640px){ .grid{ grid-template-columns:repeat(2,1fr); } }
  @media(min-width:980px){ .grid{ grid-template-columns:repeat(3,1fr); } }

  .card{
    border:1px solid rgba(232,220,194,0.1); background:var(--void-2);
    border-radius:18px; padding:22px 20px 20px; cursor:pointer; text-align:left;
    position:relative; overflow:hidden;
    transition:transform .2s cubic-bezier(.2,.8,.2,1), border-color .2s ease, box-shadow .2s ease;
  }
  .card::before{
    content:""; position:absolute; left:50%; top:38%; width:220px; height:220px; margin:-110px 0 0 -110px;
    border-radius:50%; filter:blur(46px); background:var(--glow, #C98A2C); opacity:0.35;
    transition:opacity .3s ease, transform .3s ease;
  }
  .card:hover::before, .card:focus-visible::before{ opacity:0.55; transform:scale(1.15); }
  .card:hover, .card:focus-visible{ transform:translateY(-6px); border-color:rgba(232,220,194,0.28); box-shadow:0 18px 40px rgba(0,0,0,0.45); }
  .card:active{ transform:translateY(-2px); }
  .card .num{ position:relative; font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:0.08em; background:rgba(244,241,230,0.12); padding:4px 10px; border-radius:20px; display:inline-block; margin-bottom:10px; color:var(--white); }
  .card .art{ position:relative; width:100px; margin:6px auto 4px; filter:drop-shadow(0 0 18px rgba(0,0,0,0.5)); }
  .card h2{ position:relative; font-family:var(--display); font-size:26px; margin:6px 0 2px; text-align:center; color:var(--white); }
  .card .latin{ position:relative; font-style:italic; font-weight:600; font-size:11.5px; text-align:center; opacity:0.7; margin-bottom:10px; }
  .card .footer-row{ position:relative; display:flex; align-items:center; justify-content:space-between; margin-top:10px; }
  .card .price{ font-family:var(--display); font-size:20px; color:var(--white); }
  .card .tap{ font-family:var(--mono); font-size:10px; letter-spacing:0.06em; background:rgba(232,220,194,0.14); padding:5px 10px; border-radius:20px; }

  .bg-rainbow{ --glow:#D9A441; background:linear-gradient(160deg,#1A140A,var(--void-2)); }
  .bg-brown{ --glow:#B5732E; background:linear-gradient(160deg,#1C130A,var(--void-2)); }
  .bg-bluegreen{ --glow:#5FA88F; background:linear-gradient(160deg,#0B1A16,var(--void-2)); }
  .bg-speckled{ --glow:#8A5A3A; background:linear-gradient(160deg,#160E0A,var(--void-2)); }
  .bg-cream{ --glow:#C9B383; background:linear-gradient(160deg,#191509,var(--void-2)); }

  /* ---------- modal ---------- */
  .overlay{
    position:fixed; inset:0; z-index:100; background:rgba(0,0,0,0.6); backdrop-filter:blur(4px);
    display:flex; align-items:center; justify-content:center; padding:20px;
    opacity:0; pointer-events:none; transition:opacity .2s ease;
  }
  .overlay.open{ opacity:1; pointer-events:auto; }
  .modal{
    color:#fff; border-radius:22px; max-width:460px; width:100%; max-height:90vh; overflow-y:auto;
    padding:34px 30px 30px; position:relative; text-align:center;
    transform:scale(0.85) rotate(-2deg); opacity:0; transition:transform .28s cubic-bezier(.2,1.4,.3,1), opacity .2s ease;
  }
  .overlay.open .modal{ transform:scale(1) rotate(0deg); opacity:1; }
  .modal-close{
    position:absolute; top:14px; right:14px; width:34px; height:34px; border-radius:50%;
    background:rgba(0,0,0,0.3); border:none; color:#fff; font-size:18px; cursor:pointer; line-height:1;
  }
  .modal-close:hover{ background:rgba(0,0,0,0.5); }
  .modal .num{ font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:0.08em; background:rgba(244,241,230,0.12); padding:5px 12px; border-radius:20px; display:inline-block; margin-bottom:14px; }
  .modal .art{ width:150px; margin:0 auto 8px; }
  .modal h2{ font-family:var(--display); font-size:clamp(34px,6vw,48px); margin:6px 0 4px; line-height:0.95; }
  .modal .latin{ font-style:italic; font-weight:600; font-size:13px; opacity:0.85; margin-bottom:14px; }
  .modal .caption{ font-weight:800; font-size:17px; max-width:26ch; margin:0 auto 16px; line-height:1.3; }
  .modal .facts{ display:flex; flex-direction:column; gap:8px; margin-bottom:18px; }
  .modal .fact{ font-family:var(--mono); font-size:12px; background:rgba(244,241,230,0.1); padding:8px 14px; border-radius:20px; }
  .modal .price-stamp{
    display:inline-block; font-family:var(--display); font-size:28px; color:#fff; background:rgba(0,0,0,0.35);
    padding:8px 22px; border-radius:8px; border:2.5px solid #fff; transform:rotate(-3deg); margin-bottom:16px;
  }
  .modal .price-unit{ display:block; font-family:var(--mono); font-size:9.5px; letter-spacing:0.05em; margin-top:6px; }
  .modal .how-made{ text-align:left; background:rgba(244,241,230,0.05); border:1px solid rgba(244,241,230,0.1); border-radius:14px; padding:16px 18px; }
  .modal .how-made h3{ font-family:var(--mono); font-size:11px; letter-spacing:0.08em; text-transform:uppercase; margin:0 0 12px; color:var(--white); opacity:0.75; }
  .modal .how-made ol{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; }
  .modal .how-made li{ display:flex; align-items:flex-start; gap:10px; font-size:13px; color:var(--white); opacity:0.92; line-height:1.4; }
  .hm-num{
    flex-shrink:0; width:20px; height:20px; border-radius:50%; background:var(--glow, #C98A2C);
    color:#0A0D0A; font-family:var(--mono); font-weight:700; font-size:11px;
    display:flex; align-items:center; justify-content:center; margin-top:1px;
  }

  footer{ background:var(--ink); color:#fff; padding:40px 0; text-align:center; }
  footer p{ color:#cfcfd6; max-width:44ch; margin:0 auto 20px; font-size:14px; }
  .btn{ font-family:var(--body); font-weight:800; font-size:14px; text-decoration:none; padding:13px 26px; border-radius:40px; display:inline-block; margin:0 6px; }
  .btn-primary{ background:#fff; color:var(--ink); }
  .btn-ghost{ border:2px solid rgba(255,255,255,0.4); color:#fff; }
</style>
</head>

  <div class="overlay" id="overlay">
    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalHeading">
      <button class="modal-close" id="modalClose" aria-label="Close">&times;</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <script>
    var overlay = document.getElementById('overlay');
    var modalContent = document.getElementById('modalContent');
    var modalClose = document.getElementById('modalClose');
    var lastFocused = null;

    var bgMap = {
      'd-rainbow':'bg-rainbow','d-brown':'bg-brown','d-bluegreen':'bg-bluegreen',
      'd-speckled':'bg-speckled','d-cream':'bg-cream'
    };

    function openModal(targetId, triggerEl){
      var tpl = document.getElementById(targetId);
      if (!tpl) return;
      modalContent.innerHTML = '';
      modalContent.appendChild(tpl.content.cloneNode(true));
      document.getElementById('modal').className = 'modal ' + (bgMap[targetId] || '');
      lastFocused = triggerEl;
      overlay.classList.add('open');
      document.body.style.overflow = 'hidden';
      modalClose.focus();
    }
    function closeModal(){
      overlay.classList.remove('open');
      document.body.style.overflow = '';
      if (lastFocused) lastFocused.focus();
    }

    document.querySelectorAll('.card').forEach(function(card){
      card.addEventListener('click', function(){
        openModal(card.dataset.target, card);
      });
    });
    modalClose.addEventListener('click', closeModal);
    overlay.addEventListener('click', function(e){ if (e.target === overlay) closeModal(); });
    document.addEventListener('keydown', function(e){
      if (e.key === 'Escape' && overlay.classList.contains('open')) closeModal();
    });
  </script>
